# Filesystem support (required for loading kernel/DTB from filesystems)
CONFIG_FS_FAT=y
CONFIG_FS_EXT4=y
CONFIG_CMD_FAT=y
CONFIG_CMD_EXT4=y

# FAT write support (optional, for boot partition updates)
CONFIG_FAT_WRITE=y

# ext4 support (required for loading from root filesystem)
CONFIG_EXT4_WRITE=y

# MMC/SD support for RK3399
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_ROCKCHIP=y
