# Enable filesystem support for RK3399 (based on Firefly SDK)
CONFIG_FS_FAT=y
CONFIG_FS_EXT4=y
CONFIG_CMD_FAT=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_LOADS=y
CONFIG_CMD_LOADB=y

# Enable FAT write support
CONFIG_FAT_WRITE=y
CONFIG_FAT_DEFAULT_CODEPAGE=936
CONFIG_FAT_DEFAULT_IOCHARSET="utf8"

# Enable ext4 write support  
CONFIG_EXT4_WRITE=y

# Enable additional MMC support
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_ROCKCHIP=y

# Enable Android/Rockchip specific commands (from Firefly SDK)
CONFIG_CMD_LOAD_ANDROID=y
CONFIG_CMD_BOOT_ANDROID=y
CONFIG_CMD_BOOT_ROCKCHIP=y

# Enable Rockchip image bootloader support
CONFIG_RKIMG_BOOTLOADER=y
CONFIG_ANDROID_BOOTLOADER=y
