# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rk3399-custom"
BBFILE_PATTERN_rk3399-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_rk3399-custom = "10"

LAYERDEPENDS_rk3399-custom = "core"
LAYERSERIES_COMPAT_rk3399-custom = "kirkstone langdale mickledore nanbield scarthgap"

