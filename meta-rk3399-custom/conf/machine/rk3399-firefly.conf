#@TYPE: Machine
#@NAME: Firefly RK3399
#@DESCRIPTION: Machine configuration for Firefly RK3399 board

require conf/machine/include/arm/arch-armv8a.inc
require conf/machine/include/rk3399.inc

MACHINE_FEATURES += "alsa screen wifi bluetooth"

KERNEL_DEVICETREE = "rockchip/rk3399-evb.dtb"

UBOOT_MACHINE = "firefly-rk3399_defconfig"

# Serial console
SERIAL_CONSOLES = "1500000;ttyS2"

# Bootloader offsets (in sectors, 512 bytes each)
RK3399_IDBLOADER_OFFSET = "64"
RK3399_UBOOT_OFFSET = "16384"
RK3399_TRUST_OFFSET = "24576"

# Root filesystem offset (16MB = 32768 sectors)
RK3399_ROOTFS_OFFSET = "32768"

# Boot partition size (240MB)
RK3399_BOOT_SIZE = "245760"

# CPU settings
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# GPU support
PREFERRED_PROVIDER_virtual/libgles2 = "mesa"
PREFERRED_PROVIDER_virtual/libgl = "mesa"
PREFERRED_PROVIDER_virtual/egl = "mesa"

# VPU support
MACHINE_EXTRA_RRECOMMENDS += "rockchip-mpp"

# Desktop environment support
DISTRO_FEATURES:append = " x11 wayland pulseaudio bluetooth polkit pam"


