# LinuxCNC Configuration File
# /etc/linuxcnc/linuxcnc.conf

# Realtime environment type
# Options: uspace (PREEMPT_RT userspace)
REALTIME=uspace

# Default EMC directory
EMC2_HOME=/usr

# LinuxCNC binary directory
EMC2_BIN_DIR=/usr/bin

# LinuxCNC library directory
EMC2_RTLIB_DIR=/usr/lib/linuxcnc/modules

# LinuxCNC TCL directory
EMC2_TCL_DIR=/usr/lib/tcltk/linuxcnc

# LinuxCNC help directory
EMC2_HELP_DIR=/usr/share/doc/linuxcnc

# LinuxCNC image directory
EMC2_IMAGE_DIR=/usr/share/linuxcnc

# NC files directory
EMC2_NCFILES_DIR=/usr/share/linuxcnc/ncfiles

# HAL library directory
HALLIB_DIR=/usr/share/linuxcnc/hallib

# LinuxCNC configuration path
LINUXCNC_CONFIG_PATH=~/linuxcnc/configs:/usr/share/linuxcnc/configs

# Language/locale directory
EMC2_LANG_DIR=/usr/share/locale

# Temporary directory
EMC2_TMP_DIR=/tmp/linuxcnc
