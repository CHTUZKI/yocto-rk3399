# RK3399 Complete Kernel Configuration
# Merged from defconfig for simplified management

# ARM64 Architecture
CONFIG_ARM64=y
CONFIG_SMP=y
CONFIG_HOTPLUG_CPU=y
CONFIG_PREEMPT=y
CONFIG_PREEMPT_VOLUNTARY=y

# Disable EFI STUB to generate standard ARM64 Image for U-Boot
# CONFIG_EFI_STUB is not set
# CONFIG_EFI is not set

# CPU frequency scaling
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_USERSPACE=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
# CONFIG_CPUFREQ_DT is not set
# CONFIG_ARM_RK3399_CPUFREQ is not set

# Rockchip specific
CONFIG_ARCH_ROCKCHIP=y
CONFIG_PINCTRL_ROCKCHIP=y
CONFIG_GPIO_ROCKCHIP=y
CONFIG_CLK_ROCKCHIP=y
CONFIG_ROCKCHIP_IOMMU=y
CONFIG_ROCKCHIP_PM_DOMAINS=y

# Serial console - CRITICAL for debugging
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_EARLYCON=y
CONFIG_SERIAL_EARLYCON_ARM_SEMIHOST=y
CONFIG_EARLY_PRINTK=y
CONFIG_EARLYCON=y

# Storage - MMC/SD/eMMC support - CRITICAL for root filesystem
CONFIG_MMC=y
CONFIG_PWRSEQ_EMMC=y
CONFIG_PWRSEQ_SIMPLE=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_BLOCK_MINORS=32
# SDHCI (for eMMC)
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_OF_ARASAN=y
# DW MMC (for SD card)
CONFIG_MMC_DW=y
CONFIG_MMC_DW_PLTFM=y
CONFIG_MMC_DW_ROCKCHIP=y
# MMC Debug Support
CONFIG_MMC_DEBUG=y
CONFIG_MMC_TRACE=y
CONFIG_MMC_UNSAFE_RESUME=y
CONFIG_MMC_CLKGATE=y

# I2C support (required for some drivers)
CONFIG_I2C=y
CONFIG_I2C_BOARDINFO=y
CONFIG_I2C_COMPAT=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_HELPER_AUTO=y
CONFIG_I2C_ALGOBIT=y

# USB
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_OF_SIMPLE=y
CONFIG_USB_GADGET=y
CONFIG_USB_STORAGE=y

# Network
CONFIG_NET=y
CONFIG_INET=y
CONFIG_IP_MULTICAST=y
CONFIG_IP_PNP=y
CONFIG_IP_PNP_DHCP=y
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y
CONFIG_NET_VENDOR_ROCKCHIP=y
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_ROCKCHIP=y

# Filesystems
CONFIG_ROOTFS=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_EXT4_USE_FOR_EXT4=y
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_UTF8=y
CONFIG_FAT_FS=y

# Device tree
CONFIG_OF=y
CONFIG_OF_FLATTREE=y
CONFIG_OF_EARLY_FLATTREE=y
CONFIG_OF_KOBJ=y
CONFIG_OF_DYNAMIC=y
CONFIG_OF_OVERLAY=y
CONFIG_OF_UNITTEST=y
CONFIG_OF_DEBUG=y

# Power management
CONFIG_PM=y
CONFIG_PM_SLEEP=y
CONFIG_SUSPEND=y
CONFIG_PM_DEBUG=y
CONFIG_PM_ADVANCED_DEBUG=y
# Regulator support (required for MMC power supply)
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_PWM=y
CONFIG_REGULATOR_DEBUG=y
# Clock management
CONFIG_COMMON_CLK=y
CONFIG_COMMON_CLK_DEBUG=y
CONFIG_CLK_DEBUG=y

# Device management - CRITICAL for /dev directory creation
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y

# Uevent support for device node creation
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH="/sbin/hotplug"

# Block device support
CONFIG_BLOCK=y
CONFIG_BLOCK_LEGACY_AUTOLOAD=y
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_SD=y
CONFIG_SDIO=y
CONFIG_MMC_SDIO=y

# System filesystems
CONFIG_SYSFS=y
CONFIG_SYSFS_SYSCALL=y

# Character devices
CONFIG_TTY=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# Initramfs support
CONFIG_BLK_DEV_INITRD=y
CONFIG_INITRAMFS_SOURCE=y

# Kernel debugging
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_BUGVERBOSE=y
CONFIG_DEBUG_FS=y
CONFIG_EXT4_DEBUG=y

# Partition support
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y
CONFIG_MSDOS_PARTITION=y
CONFIG_MSDOS_PARTITION=y
CONFIG_OF_PARTITION=y

# Disk and partition drivers
CONFIG_GPT_PARTITION=y
CONFIG_MAC_PARTITION=y
CONFIG_MSDOS_PARTITION=y
CONFIG_EFI_PARTITION=y

# SCSI and storage drivers
CONFIG_SCSI=y
CONFIG_SCSI_COMMON=y
CONFIG_BLK_DEV_SD=y
CONFIG_SCSI_SCAN_ASYNC=y

# Disable problematic drivers
# CONFIG_MISC_ROCKPI_MCU is not set
