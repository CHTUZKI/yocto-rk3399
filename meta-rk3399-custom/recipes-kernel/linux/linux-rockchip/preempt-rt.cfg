# PREEMPT_RT Real-Time Kernel Configuration for LinuxCNC
# This configuration enables full preemption for real-time performance

# Enable Full Preemptible Kernel (RT)
CONFIG_PREEMPT_RT=y
CONFIG_PREEMPT_RT_FULL=y
# CONFIG_PREEMPT_NONE is not set
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT is not set

# High Resolution Timers - Required for real-time
CONFIG_HIGH_RES_TIMERS=y
CONFIG_HRTIMER_CPU_BASE=y

# Timer Frequency - Higher frequency for better latency
CONFIG_HZ_1000=y
CONFIG_HZ=1000

# Real-time scheduling
CONFIG_RT_GROUP_SCHED=y
CONFIG_RT_MUTEXES=y

# CPU isolation for real-time tasks
CONFIG_CPU_ISOLATION=y
CONFIG_NO_HZ_FULL=y

# Disable features that can cause latency spikes
# CONFIG_DEBUG_PREEMPT is not set
# CONFIG_PREEMPT_TRACER is not set
# CONFIG_DEBUG_SPINLOCK is not set
# CONFIG_DEBUG_MUTEXES is not set
# CONFIG_DEBUG_LOCK_ALLOC is not set
# CONFIG_PROVE_LOCKING is not set
# CONFIG_LOCKDEP is not set
# CONFIG_DEBUG_ATOMIC_SLEEP is not set

# Reduce kernel latency
CONFIG_NO_HZ=y
CONFIG_NO_HZ_IDLE=y

# Memory management for real-time
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_COMPACTION=y

# IRQ Threading - Essential for PREEMPT_RT
CONFIG_IRQ_FORCED_THREADING=y
CONFIG_IRQ_WORK=y

# Process Timing
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_CPU_TIMERS_TASK_WORK=y

# Soft/Hard Lockup Detection
CONFIG_SOFTLOCKUP_DETECTOR=y
# CONFIG_HARDLOCKUP_DETECTOR is not set
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120

# RCU configuration for real-time
CONFIG_RCU_EXPERT=y
CONFIG_RCU_BOOST=y
CONFIG_RCU_BOOST_DELAY=500
CONFIG_RCU_NOCB_CPU=y

# Kernel debugging options that don't impact RT performance
CONFIG_PRINTK_TIME=y
CONFIG_DYNAMIC_DEBUG=y

# Disable some debugging to improve latency
# CONFIG_DEBUG_INFO_BTF is not set
# CONFIG_KPROBES is not set

# Futex support for userspace synchronization
CONFIG_FUTEX=y
CONFIG_FUTEX_PI=y

# Proper priority inheritance
CONFIG_RT_MUTEXES=y
CONFIG_BASE_FULL=y

# SMP optimizations
CONFIG_SMP=y
CONFIG_SCHED_MC=y
CONFIG_SCHED_SMT=y

# Reduce timer resolution for better latency
CONFIG_TICK_ONESHOT=y
CONFIG_GENERIC_CLOCKEVENTS=y
CONFIG_GENERIC_CLOCKEVENTS_BROADCAST=y

# Enable /dev/cpu/*/msr and /dev/cpu/*/cpuid for CPU tuning
CONFIG_X86_MSR=y
CONFIG_X86_CPUID=y

# GPIO and Hardware Access for LinuxCNC
CONFIG_GPIOLIB=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_CDEV=y
CONFIG_GPIO_CDEV_V1=y

# Parallel Port Support (optional, for legacy LinuxCNC setups)
CONFIG_PARPORT=m
CONFIG_PARPORT_PC=m
CONFIG_PARPORT_1284=y

# SPI Support (for some LinuxCNC hardware)
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_SPIDEV=y
CONFIG_SPI_ROCKCHIP=y

# I2C Support
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_RK3X=y

# PWM Support (for spindle control, etc.)
CONFIG_PWM=y
CONFIG_PWM_SYSFS=y
CONFIG_PWM_ROCKCHIP=y

# Industrial I/O for sensors
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGER=y
